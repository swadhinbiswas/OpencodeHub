/opt/opencodehub/data/logs/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 opencodehub opencodehub
    sharedscripts
    postrotate
        # Signal the app to reopen log files if needed
        systemctl reload opencodehub 2>/dev/null || true
    endscript
}
