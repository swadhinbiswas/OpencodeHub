apiVersion: v2
name: opencodehub
description: OpenCodeHub — Self-hosted Git platform with CI/CD, code review, and collaboration
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - git
  - ci-cd
  - code-review
  - self-hosted
  - devops
home: https://github.com/swadhinbiswas/OpencodeHub
sources:
  - https://github.com/swadhinbiswas/OpencodeHub
maintainers:
  - name: swadhinbiswas
    url: https://github.com/swadhinbiswas

dependencies:
  - name: postgresql
    version: "~15.5"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "~19.5"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: minio
    version: "~14.6"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
