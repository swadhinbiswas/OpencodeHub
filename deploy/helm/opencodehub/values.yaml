replicaCount: 2

image:
  repository: ghcr.io/opencodehub/opencodehub
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 4321

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opencodehub.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 30

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

env:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "4321"
  DATA_DIR: /data
  REPOS_PATH: /data/repos
  STORAGE_PATH: /data/storage
  CACHE_PATH: /data/cache
  SSH_PATH: /data/ssh
  DATABASE_TYPE: postgres
  STORAGE_TYPE: local

envSecrets:
  create: true
  existingSecretName: ""
  DATABASE_URL: ""
  REDIS_URL: ""
  JWT_SECRET: ""
  SERVER_URL: ""
  INTERNAL_HOOK_SECRET: ""
  RUNNER_SECRET: ""

extraEnv: []
extraEnvFrom: []

probes:
  liveness:
    path: /api/health
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 6
  readiness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  startup:
    enabled: true
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  allowSameNamespace: true
  additionalIngress: []
  additionalEgress: []

worker:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# ── Init Container: DB Migration ───────────────────────────────────────────────
initContainers:
  dbMigrate:
    enabled: true
    command: ["npx", "drizzle-kit", "push"]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ── Backup CronJob ─────────────────────────────────────────────────────────────
backup:
  enabled: false
  schedule: "0 2 * * *" # Daily at 2 AM
  incremental: false
  retention:
    days: 30
  s3:
    bucket: ""
    prefix: "opencodehub-backups"
  encryption:
    enabled: false
    keySecretName: "" # Secret containing BACKUP_ENCRYPTION_KEY
    keySecretKey: "encryption-key"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# ── Monitoring ─────────────────────────────────────────────────────────────────
metrics:
  enabled: true
  path: /api/metrics
  serviceMonitor:
    enabled: false
    interval: 30s
    namespace: ""
    labels: {}

# ── Sub-chart: PostgreSQL ──────────────────────────────────────────────────────
postgresql:
  enabled: false
  auth:
    database: opencodehub
    username: opencodehub
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 20Gi

# ── Sub-chart: Redis ───────────────────────────────────────────────────────────
redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: true
    existingSecret: ""
  master:
    persistence:
      enabled: true
      size: 5Gi

# ── Sub-chart: MinIO ──────────────────────────────────────────────────────────
minio:
  enabled: false
  auth:
    rootUser: opencodehub
    existingSecret: ""
  defaultBuckets: "opencodehub-storage"
  persistence:
    enabled: true
    size: 50Gi
