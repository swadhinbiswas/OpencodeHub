{{- if .Values.envSecrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencodehub.fullname" . }}-env
  labels:
    {{- include "opencodehub.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.envSecrets.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.envSecrets.REDIS_URL | quote }}
  JWT_SECRET: {{ .Values.envSecrets.JWT_SECRET | quote }}
  SERVER_URL: {{ .Values.envSecrets.SERVER_URL | quote }}
  INTERNAL_HOOK_SECRET: {{ .Values.envSecrets.INTERNAL_HOOK_SECRET | quote }}
  RUNNER_SECRET: {{ .Values.envSecrets.RUNNER_SECRET | quote }}
{{- end }}
